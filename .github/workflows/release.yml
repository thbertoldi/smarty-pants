name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, api]
    env:
      # x86-64 baseline; never compile release assets for the runner's native CPU.
      RUSTFLAGS: -C target-cpu=x86-64
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake desktop-file-utils wtype wl-clipboard
      - run: rustup toolchain install 1.91.1 --profile minimal && rustup override set 1.91.1
      - name: Set portable native-library defaults
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          features=tray
          if [ "$FLAVOR" = cpu ]; then features=local,tray; fi
          cargo test --workspace --locked --no-default-features --features "smarty-pants-daemon/$features"
          cargo build --release --workspace --locked --no-default-features --features "smarty-pants-daemon/$features"
          if [ "$FLAVOR" = cpu ]; then python3 scripts/check-portable-build.py; fi
          strip target/release/smarty-pants target/release/smarty-pants-daemon
      - name: Package and verify installation
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          scripts/package-release.sh "$FLAVOR"
          mkdir target/unpacked
          tar -xzf target/dist/*.tar.gz -C target/unpacked
          python3 scripts/test-installer.py target/unpacked/*
          python3 scripts/test-lifecycle.py target/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.flavor }}
          path: target/dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"
          ci_run=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$ci_run"
          gh run watch "$ci_run" --exit-status --interval 30
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Smarty Pants $version" --notes-file docs/release-notes.md
