name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: 1.88.0
            flavor: api
            features: tray
          - rust: 1.91.1
            features: local,tray
            flavor: cpu
          - rust: 1.91.1
            features: vulkan,tray
            flavor: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake libvulkan-dev glslc shellcheck desktop-file-utils
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy && rustup override set ${{ matrix.rust }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ matrix.rust }}-${{ matrix.flavor }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features smarty-pants-daemon/${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace --locked --no-default-features --features smarty-pants-daemon/${{ matrix.features }}
      - run: shellcheck packaging/linux/*.sh scripts/*.sh && desktop-file-validate packaging/linux/computer.smarty-pants.desktop
      - run: python3 scripts/check-docs.py
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.91.1 --profile minimal && rustup override set 1.91.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
